name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Rust Binary
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: lpcache-linux-x86_64
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            artifact_name: lpcache-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: lpcache-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: lpcache-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: lpcache-windows
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Setup Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Optimized Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Artifacts (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.artifact_name }}.tar.gz lpcache
          cd -

      - name: Package Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          powershell Compress-Archive -Path target\${{ matrix.target }}\release\lpcache.exe -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.*

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten Artifacts
        run: |
          mkdir -p release
          mv artifacts/**/* release/ 2>/dev/null || true
          ls -la release/

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
