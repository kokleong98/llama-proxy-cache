[package]
name = "lpcache-config"
version = "0.1.0"
edition = "2024"
description = "CLI and web configurator for the lpcache proxy"
license = "MIT"

[[bin]]
name = "lpcache-config"
path = "src/main.rs"

[dependencies]
axum = "0.8"
dialoguer = "0.11"
futures = "0.3"
lpcache = { path = ".." }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
